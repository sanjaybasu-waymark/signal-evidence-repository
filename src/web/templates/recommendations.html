<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations - Signal Evidence Library</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>Signal Evidence Library</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/recommendations" class="active">Recommendations</a></li>
                    <li><a href="/search">Search</a></li>
                    <li><a href="/about">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="recommendations-header">
        <div class="container">
            <h2>Evidence-Based Recommendations</h2>
            <div class="filters">
                <div class="filter-group">
                    <label for="domain-filter">Domain:</label>
                    <select id="domain-filter">
                        <option value="">All Domains</option>
                        <!-- Domains will be loaded here via JavaScript -->
                    </select>
                </div>
                <div class="filter-group">
                    <label for="role-filter">Role:</label>
                    <select id="role-filter">
                        <option value="">All Roles</option>
                        <!-- Roles will be loaded here via JavaScript -->
                    </select>
                </div>
                <div class="filter-group">
                    <label for="evidence-filter">Evidence Level:</label>
                    <select id="evidence-filter">
                        <option value="">All Levels</option>
                        <option value="A">Level A</option>
                        <option value="B">Level B</option>
                        <option value="C">Level C</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <section class="recommendations-list">
        <div class="container">
            <div class="recommendation-grid" id="recommendations-container">
                <!-- Recommendations will be loaded here via JavaScript -->
                <div class="loading">Loading recommendations...</div>
            </div>
            <div class="pagination" id="pagination">
                <!-- Pagination will be added here via JavaScript -->
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Signal Evidence Library. All rights reserved.</p>
            <p>A comprehensive evidence repository for population health care management team interventions.</p>
        </div>
    </footer>

    <script src="/static/js/recommendations.js"></script>
</body>
</html>
