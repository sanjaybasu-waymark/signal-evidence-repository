services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - API_PORT=8000
      - WEB_PORT=5000
      - DATA_DIR=./data
      - LOG_LEVEL=INFO
    command: ["python", "run_api.py"]
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - API_PORT=8000
      - WEB_PORT=5000
      - DATA_DIR=./data
      - LOG_LEVEL=INFO
    command: ["python", "run_web.py"]
    restart: unless-stopped
    depends_on:
      - api
