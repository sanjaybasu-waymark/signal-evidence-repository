<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waymark's Evidence Repository for Population Health Teams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Waymark's Evidence Repository for Population Health Teams</h1>
            <p class="subtitle">Evidence-based recommendations for improving population health outcomes</p>
        </div>
    </header>

    <main>
        <section class="search-section">
            <div class="container">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search recommendations...">
                    <div class="filters">
                        <select id="domain-filter">
                            <option value="">All Domains</option>
                        </select>
                        <select id="role-filter">
                            <option value="">All Roles</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <section class="recommendations-section">
            <div class="container">
                <div id="recommendations-container" class="recommendations-container">
                    <!-- Recommendations will be loaded here -->
                    <div class="loading">Loading recommendations...</div>
                </div>
            </div>
        </section>

        <!-- Modal for recommendation details -->
        <div id="recommendation-modal" class="modal">
            <div class="modal-container">
                <span id="close-modal" class="close">&times;</span>
                <div id="modal-content" class="modal-content">
                    <!-- Recommendation details will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 <a href="https://www.waymarkcare.com" target="_blank">www.waymarkcare.com</a>. All rights reserved.</p>
        </div>
    </footer>

    <!-- Load the recommendation data files -->
    <script src="data/recommendations_part1.js"></script>
    <script src="data/recommendations_part2.js"></script>
    <script src="data/recommendations_part3.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
