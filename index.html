<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waymark's Evidence Repository for Population Health Teams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
          --primary-color: #5f2eea; /* Purple from Waymark */
          --secondary-color: #4ca6ff; /* Light blue from Waymark */
          --accent-color: #00c48c; /* Green from Waymark */
          --highlight-color: #ff7a00; /* Orange from Waymark */
          --text-color: #1a1a1a;
          --light-text: #4f4f4f;
          --light-bg: #f8f9fa;
          --card-bg: #e6f0f9; /* Light blue background for cards */
          --border-color: #dee2e6;
          --white: #ffffff;
        }
        
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        
        body {
          font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
          line-height: 1.6;
          color: var(--text-color);
          background-color: var(--white);
        }
        
        .container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 0 20px;
        }
        
        header {
          background-color: var(--primary-color);
          color: var(--white);
          padding: 40px 0;
          margin-bottom: 30px;
        }
        
        .header-container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 0 20px;
          text-align: center;
        }
        
        header h1 {
          font-size: 36px;
          font-weight: 700;
          margin-bottom: 10px;
        }
        
        header .subtitle {
          font-size: 18px;
          font-weight: 400;
        }
        
        .search-section {
          margin-bottom: 30px;
        }
        
        .search-container {
          display: flex;
          flex-direction: column;
          gap: 15px;
        }
        
        #search-input {
          padding: 12px 15px;
          border: 1px solid var(--border-color);
          border-radius: 5px;
          font-size: 16px;
          width: 100%;
          font-family: 'Heebo', sans-serif;
        }
        
        .filters {
          display: flex;
          gap: 15px;
        }
        
        select {
          padding: 10px 15px;
          border: 1px solid var(--border-color);
          border-radius: 5px;
          font-size: 16px;
          flex: 1;
          font-family: 'Heebo', sans-serif;
        }
        
        .recommendations-section {
          margin-bottom: 50px;
        }
        
        .domain-section {
          margin-bottom: 40px;
        }
        
        .domain-title {
          font-size: 28px;
          font-weight: 700;
          color: var(--primary-color);
          margin-bottom: 20px;
          padding-bottom: 10px;
          border-bottom: 2px solid var(--primary-color);
        }
        
        .role-section {
          margin-bottom: 30px;
        }
        
        .role-title {
          font-size: 22px;
          font-weight: 600;
          color: var(--secondary-color);
          margin-bottom: 15px;
        }
        
        .recommendation-cards {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
          gap: 20px;
        }
        
        .recommendation-card {
          background-color: var(--card-bg);
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
          transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .recommendation-card:hover {
          transform: translateY(-5px);
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .card-header {
          padding: 15px 20px;
          background-color: var(--secondary-color);
          color: var(--white);
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        
        .card-header h3 {
          font-size: 18px;
          font-weight: 600;
          margin: 0;
          flex: 1;
        }
        
        .evidence-level {
          background-color: var(--white);
          color: var(--secondary-color);
          padding: 3px 8px;
          border-radius: 4px;
          font-size: 14px;
          font-weight: 600;
        }
        
        .card-body {
          padding: 15px 20px;
        }
        
        .card-body p {
          margin-bottom: 15px;
          color: var(--text-color);
        }
        
        .card-footer {
          padding: 15px 20px;
          background-color: var(--light-bg);
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        
        .role-tag {
          background-color: var(--accent-color);
          color: var(--white);
          padding: 5px 10px;
          border-radius: 4px;
          font-size: 14px;
          font-weight: 500;
        }
        
        .view-details-btn {
          background-color: var(--primary-color);
          color: var(--white);
          border: none;
          padding: 8px 15px;
          border-radius: 4px;
          cursor: pointer;
          font-size: 14px;
          font-weight: 500;
          transition: background-color 0.3s;
        }
        
        .view-details-btn:hover {
          background-color: #4a1fd6;
        }
        
        .modal {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.5);
          z-index: 1000;
          overflow-y: auto;
        }
        
        .modal-container {
          background-color: var(--white);
          margin: 50px auto;
          max-width: 800px;
          border-radius: 8px;
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
          position: relative;
        }
        
        .close {
          position: absolute;
          top: 15px;
          right: 20px;
          font-size: 28px;
          font-weight: bold;
          color: var(--text-color);
          cursor: pointer;
        }
        
        .modal-content {
          padding: 30px;
        }
        
        .modal-content h2 {
          font-size: 24px;
          font-weight: 700;
          color: var(--primary-color);
          margin-bottom: 20px;
        }
        
        .modal-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 15px;
          margin-bottom: 25px;
          padding-bottom: 15px;
          border-bottom: 1px solid var(--border-color);
        }
        
        .modal-meta span {
          font-size: 16px;
          color: var(--light-text);
        }
        
        .modal-section {
          margin-bottom: 25px;
        }
        
        .modal-section h3 {
          font-size: 18px;
          font-weight: 600;
          color: var(--secondary-color);
          margin-bottom: 10px;
        }
        
        .modal-section p {
          font-size: 16px;
          line-height: 1.6;
          color: var(--text-color);
        }
        
        .no-results {
          text-align: center;
          padding: 50px 0;
          font-size: 18px;
          color: var(--light-text);
        }
        
        footer {
          background-color: var(--light-bg);
          padding: 20px 0;
          text-align: center;
          margin-top: 50px;
        }
        
        footer p {
          color: var(--light-text);
          font-size: 14px;
        }
        
        footer a {
          color: var(--primary-color);
          text-decoration: none;
        }
        
        footer a:hover {
          text-decoration: underline;
        }
        
        .loading {
          text-align: center;
          padding: 30px 0;
          font-size: 18px;
          color: var(--light-text);
        }
        
        @media (max-width: 768px) {
          .filters {
            flex-direction: column;
          }
          
          .recommendation-cards {
            grid-template-columns: 1fr;
          }
          
          .modal-container {
            margin: 20px;
            width: auto;
          }
        }
    </style>
</head>

        <div class="header-container">

                <div id="modal-content" class="modal-content">

            </div>

    </main>

            const searchInput = document.getElementById('search-input');
            const domainFilter = document.getElementById('domain-filter');
            const roleFilter = document.getElementById('role-filter');
            const modal = document.getElementById('recommendation-modal');
            const modalContent = document.getElementById('modal-content');
            const closeModal = document.getElementById('close-modal');
            
            // Extract unique domains and roles for filters
            const domains = [...new Set(recommendations.map(rec => rec.domain))].sort();
            const roles = [...new Set(recommendations.map(rec => rec.role))].sort();
            
            // Populate filter dropdowns
            domainFilter.innerHTML = '<option value="">All Domains</option>';
            domains.forEach(domain => {
                domainFilter.innerHTML += `<option value="${domain}">${domain}</option>`;
            });
            
            roleFilter.innerHTML = '<option value="">All Roles</option>';
            roles.forEach(role => {
                roleFilter.innerHTML += `<option value="${role}">${role}</option>`;
            });
            
            // Function to display recommendations
            function displayRecommendations(recs) {
                // Group recommendations by domain
                const recsByDomain = {};
                recs.forEach(rec => {
                    if (!recsByDomain[rec.domain]) {
                        recsByDomain[rec.domain] = [];
                    }
                    recsByDomain[rec.domain].push(rec);
                });
                
                // Clear container
                recommendationsContainer.innerHTML = '';
                
                // Display recommendations grouped by domain
                Object.keys(recsByDomain).sort().forEach(domain => {
                    // Create domain section
                    const domainSection = document.createElement('div');
                    domainSection.className = 'domain-section';
                    domainSection.innerHTML = `<h2 class="domain-title">${domain}</h2>`;
                    
                    // Group by role within domain
                    const recsByRole = {};
                    recsByDomain[domain].forEach(rec => {
                        if (!recsByRole[rec.role]) {
                            recsByRole[rec.role] = [];
                        }
                        recsByRole[rec.role].push(rec);
                    });
                    
                    // Display recommendations grouped by role within domain
                    Object.keys(recsByRole).sort().forEach(role => {
                        const roleSection = document.createElement('div');
                        roleSection.className = 'role-section';
                        roleSection.innerHTML = `<h3 class="role-title">${role}</h3>`;
                        
                        const roleCards = document.createElement('div');
                        roleCards.className = 'recommendation-cards';
                        
                        recsByRole[role].forEach(rec => {
                            const card = document.createElement('div');
                            card.className = 'recommendation-card';
                            card.innerHTML = `
                                <div class="card-header">
                                    <h3>${rec.title}</h3>
                                    <span class="evidence-level">Evidence Level: ${rec.evidence_level}</span>
                                </div>
                                <div class="card-body">
                                    <p>${rec.recommendation.substring(0, 150)}${rec.recommendation.length > 150 ? '...' : ''}</p>
                                </div>
                                <div class="card-footer">
                                    <span class="role-tag">${rec.role}</span>
                                    <button class="view-details-btn" data-id="${rec.id}">View Details</button>
                                </div>
                            `;
                            roleCards.appendChild(card);
                        });
                        
                        roleSection.appendChild(roleCards);
                        domainSection.appendChild(roleSection);
                    });
                    
                    recommendationsContainer.appendChild(domainSection);
                });
                
                // No results message
                if (recs.length === 0) {
                    recommendationsContainer.innerHTML = '<div class="no-results">No recommendations found matching your criteria.</div>';
                }
                
                // Add event listeners to view details buttons
                document.querySelectorAll('.view-details-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const recId = parseInt(this.getAttribute('data-id'));
                        const rec = recommendations.find(r => r.id === recId);
                        if (rec) {
                            showRecommendationDetails(rec);
                        }
                    });
                });
            }
            
            // Function to show recommendation details in modal
            function showRecommendationDetails(rec) {
                modalContent.innerHTML = `
                    <h2>${rec.title}</h2>
                    <div class="modal-meta">
                        <span class="modal-domain">Domain: ${rec.domain}</span>
                        <span class="modal-role">Role: ${rec.role}</span>
                        <span class="modal-evidence">Evidence Level: ${rec.evidence_level}</span>
                    </div>
                    <div class="modal-section">
                        <h3>Recommendation</h3>
                        <p>${rec.recommendation}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Implementation</h3>
                        <p>${rec.implementation}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Expected Outcomes</h3>
                        <p>${rec.expected_outcomes}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Target Population</h3>
                        <p>${rec.target_population}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Cost Effectiveness</h3>
                        <p>${rec.cost_effectiveness}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Citation</h3>
                        <p>
                            ${rec.citation.authors} (${rec.citation.year}). 
                            ${rec.citation.title}. 
                            <em>${rec.citation.journal}</em>, 
                            ${rec.citation.volume}${rec.citation.issue ? '(' + rec.citation.issue + ')' : ''}, 
                            ${rec.citation.pages}.
                            ${rec.citation.doi ? 'DOI: ' + rec.citation.doi : ''}
                            ${rec.citation.url ? `<br><a href="${rec.citation.url}" target="_blank">View Source</a>` : ''}
                        </p>
                    </div>
                `;
                modal.style.display = 'block';
            }
            
            // Event listeners for filters and search
            function filterRecommendations() {
                const searchTerm = searchInput.value.toLowerCase();
                const selectedDomain = domainFilter.value;
                const selectedRole = roleFilter.value;
                
                const filtered = recommendations.filter(rec => {
                    const matchesDomain = !selectedDomain || rec.domain === selectedDomain;
                    const matchesRole = !selectedRole || rec.role === selectedRole;
                    const matchesSearch = !searchTerm || 
                        rec.title.toLowerCase().includes(searchTerm) || 
                        rec.recommendation.toLowerCase().includes(searchTerm);
                    
                    return matchesDomain && matchesRole && matchesSearch;
                });
                
                displayRecommendations(filtered);
            }
            
            searchInput.addEventListener('input', filterRecommendations);
            domainFilter.addEventListener('change', filterRecommendations);
            roleFilter.addEventListener('change', filterRecommendations);
            
            // Close modal
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
            
            // Initial display
            displayRecommendations(recommendations);
        });
    </script>
</body>
</html>
