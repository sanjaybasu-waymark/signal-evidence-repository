<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evidence-Based Protocols for Non-Physician Team Members</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1, h2, h3 {
      color: #2c3e50;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }
    .filter-group {
      flex: 1;
      min-width: 200px;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .protocol-list {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 20px;
      max-height: 400px;
      overflow-y: auto;
    }
    .protocol-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .protocol-item:hover {
      background-color: #f9f9f9;
    }
    .protocol-item.selected {
      background-color: #e3f2fd;
    }
    .protocol-detail {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 20px;
    }
    .protocol-detail h3 {
      margin-top: 0;
    }
    .protocol-detail-section {
      margin-bottom: 15px;
    }
    .protocol-detail-section h4 {
      margin-bottom: 5px;
      color: #3498db;
    }
    .count-badge {
      background-color: #3498db;
      color: white;
      border-radius: 50%;
      padding: 2px 8px;
      font-size: 0.8em;
      margin-left: 5px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header-right {
      text-align: right;
    }
    @media (max-width: 768px) {
      .filters {
        flex-direction: column;
      }
      .filter-group {
        width: 100%;
      }
      .header {
        flex-direction: column;
        text-align: center;
      }
      .header-right {
        text-align: center;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Evidence-Based Protocols for Non-Physician Team Members</h1>
        <p>A repository of peer-reviewed protocols focused on marginalized and underserved patients</p>
      </div>
      <div class="header-right">
        <p>Author: Sanjay Basu MD PhD<br>
        Waymark & University of California San Francisco</p>
      </div>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label for="domain-filter">Filter by Domain:</label>
        <select id="domain-filter">
          <option value="all">All Domains</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="role-filter">Filter by Role:</label>
        <select id="role-filter">
          <option value="all">All Roles</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="search-filter">Search:</label>
        <input type="text" id="search-filter" placeholder="Search protocols..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
      </div>
    </div>

    <div class="protocol-list" id="protocol-list">
      <!-- Protocol items will be populated here -->
    </div>

    <div class="protocol-detail" id="protocol-detail">
      <p>Select a protocol to view details</p>
    </div>
  </div>

  <script src="recommendations-data.js"></script>
  <script>
    // Compatibility fix for different variable names
    const allProtocols = window.allRecommendations || window.allProtocols || [];
    
    // Initialize variables
    let selectedProtocol = null;
    let filteredProtocols = [];
    
    // DOM elements
    const domainFilter = document.getElementById('domain-filter');
    const roleFilter = document.getElementById('role-filter');
    const searchFilter = document.getElementById('search-filter');
    const protocolList = document.getElementById('protocol-list');
    const protocolDetail = document.getElementById('protocol-detail');
    
    // Normalize domain names to prevent duplicates
    function normalizeDomain(domain) {
      if (!domain) return '';
      
      const domainMap = {
        'ckd': 'chronic kidney disease',
        'post-mi': 'post mi',
        'post mi': 'post mi',
        'post-stroke': 'post stroke',
        'post stroke': 'post stroke',
        'food security': 'food insecurity',
        'food insecurity': 'food insecurity',
        'transportation': 'transportation insecurity',
        'transportation insecurity': 'transportation insecurity',
        'substance use': 'substance use disorders',
        'substance use disorders': 'substance use disorders'
      };
      
      const normalizedDomain = domain.toLowerCase();
      return domainMap[normalizedDomain] || normalizedDomain;
    }
    
    // Normalize role names for consistency
    function normalizeRole(role) {
      if (!role) return '';
      
      const roleMap = {
        'behavioral health specialist': 'social worker (clinical/therapy)',
        'behavioral health provider': 'social worker (clinical/therapy)',
        'nurse': 'nurse care manager',
        'care manager': 'nurse care manager',
        'social worker (non-clinical)': 'care coordinator',
        'primary care provider': 'clinical pharmacist'
      };
      
      const normalizedRole = role.toLowerCase();
      return roleMap[normalizedRole] || normalizedRole;
    }
    
    // Extract unique domains and roles
    function extractFilters() {
      const domains = new Set();
      const roles = new Set();
      
      allProtocols.forEach(protocol => {
        if (protocol.domain) {
          domains.add(normalizeDomain(protocol.domain));
        }
        if (protocol.role) {
          roles.add(normalizeRole(protocol.role));
        }
      });
      
      // Populate domain filter
      Array.from(domains).sort().forEach(domain => {
        const option = document.createElement('option');
        option.value = domain;
        option.textContent = domain.charAt(0).toUpperCase() + domain.slice(1);
        domainFilter.appendChild(option);
      });
      
      // Populate role filter
      Array.from(roles).sort().forEach(role => {
        const option = document.createElement('option');
        option.value = role;
        option.textContent = role.charAt(0).toUpperCase() + role.slice(1);
        roleFilter.appendChild(option);
      });
    }
    
    // Filter protocols based on selected filters
    function filterProtocols() {
      const selectedDomain = domainFilter.value;
      const selectedRole = roleFilter.value;
      const searchText = searchFilter.value.toLowerCase();
      
      filteredProtocols = allProtocols.filter(protocol => {
        const matchesDomain = selectedDomain === 'all' || 
                             normalizeDomain(protocol.domain) === selectedDomain;
        
        const matchesRole = selectedRole === 'all' || 
                           normalizeRole(protocol.role) === selectedRole;
        
        const matchesSearch = !searchText || 
                             (protocol.title && protocol.title.toLowerCase().includes(searchText)) ||
                             (protocol.implementation_guidance && protocol.implementation_guidance.toLowerCase().includes(searchText)) ||
                             (protocol.implementation && protocol.implementation.toLowerCase().includes(searchText)) ||
                             (protocol.expected_outcomes && protocol.expected_outcomes.toLowerCase().includes(searchText)) ||
                             (protocol.outcomes && protocol.outcomes.toLowerCase().includes(searchText)) ||
                             (protocol.target_population && protocol.target_population.toLowerCase().includes(searchText));
        
        return matchesDomain && matchesRole && matchesSearch;
      });
      
      renderProtocolList();
    }
    
    // Render the filtered protocol list
    function renderProtocolList() {
      protocolList.innerHTML = '';
      
      if (filteredProtocols.length === 0) {
        protocolList.innerHTML = '<p>No protocols match the selected filters</p>';
        return;
      }
      
      filteredProtocols.forEach((protocol, index) => {
        const protocolItem = document.createElement('div');
        protocolItem.className = 'protocol-item';
        protocolItem.textContent = protocol.title || 'Untitled Protocol';
        protocolItem.dataset.index = index;
        
        protocolItem.addEventListener('click', () => {
          document.querySelectorAll('.protocol-item').forEach(item => {
            item.classList.remove('selected');
          });
          protocolItem.classList.add('selected');
          selectedProtocol = protocol;
          renderProtocolDetail();
        });
        
        protocolList.appendChild(protocolItem);
      });
    }
    
    // Render the selected protocol detail
    function renderProtocolDetail() {
      if (!selectedProtocol) {
        protocolDetail.innerHTML = '<p>Select a protocol to view details</p>';
        return;
      }
      
      let html = `
        <h3>${selectedProtocol.title || 'Untitled Protocol'}</h3>
        
        <div class="protocol-detail-section">
          <h4>Domain</h4>
          <p>${selectedProtocol.domain || 'Not specified'}</p>
        </div>
        
        <div class="protocol-detail-section">
          <h4>Role</h4>
          <p>${selectedProtocol.role || 'Not specified'}</p>
        </div>
      `;
      
      if (selectedProtocol.target_population) {
        html += `
          <div class="protocol-detail-section">
            <h4>Target Population</h4>
            <p>${selectedProtocol.target_population}</p>
          </div>
        `;
      }
      
      const implementation = selectedProtocol.implementation_guidance || selectedProtocol.implementation;
      if (implementation) {
        html += `
          <div class="protocol-detail-section">
            <h4>Implementation Guidance</h4>
            <p>${implementation.replace(/\n/g, '<br>')}</p>
          </div>
        `;
      }
      
      const outcomes = selectedProtocol.expected_outcomes || selectedProtocol.outcomes;
      if (outcomes) {
        html += `
          <div class="protocol-detail-section">
            <h4>Expected Outcomes</h4>
            <p>${outcomes}</p>
          </div>
        `;
      }
      
      if (selectedProtocol.evidence) {
        html += `
          <div class="protocol-detail-section">
            <h4>Evidence</h4>
            <p>${selectedProtocol.evidence}</p>
          </div>
        `;
      }
      
      protocolDetail.innerHTML = html;
    }
    
    // Count protocols by domain and role
    function countProtocols() {
      const domainCounts = {};
      const roleCounts = {};
      
      allProtocols.forEach(protocol => {
        const domain = normalizeDomain(protocol.domain);
        const role = normalizeRole(protocol.role);
        
        if (domain) {
          domainCounts[domain] = (domainCounts[domain] || 0) + 1;
        }
        
        if (role) {
          roleCounts[role] = (roleCounts[role] || 0) + 1;
        }
      });
      
      // Add counts to domain options
      Array.from(domainFilter.options).forEach(option => {
        if (option.value !== 'all') {
          const count = domainCounts[option.value] || 0;
          option.textContent += ` (${count})`;
        }
      });
      
      // Add counts to role options
      Array.from(roleFilter.options).forEach(option => {
        if (option.value !== 'all') {
          const count = roleCounts[option.value] || 0;
          option.textContent += ` (${count})`;
        }
      });
    }
    
    // Initialize the application
    function init() {
      console.log(`Loaded ${allProtocols.length} protocols`);
      
      // Extract and populate filters
      extractFilters();
      
      // Add counts to filters
      countProtocols();
      
      // Set up event listeners
      domainFilter.addEventListener('change', filterProtocols);
      roleFilter.addEventListener('change', filterProtocols);
      searchFilter.addEventListener('input', filterProtocols);
      
      // Initial filter
      filterProtocols();
    }
    
    // Start the application when the page loads
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
