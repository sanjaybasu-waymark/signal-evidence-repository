<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waymark Population Health Protocol Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }
        .header {
            background-color: #0d6efd;
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .header img {
            height: 50px;
            margin-right: 15px;
        }
        .header h1 {
            font-weight: 600;
            margin: 0;
            font-size: 1.8rem;
        }
        .domain-box, .role-box {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .domain-box:hover, .role-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .domain-box h3, .role-box h3 {
            color: #0d6efd;
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .count-badge {
            background-color: #0d6efd;
            color: white;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .protocol-item {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .protocol-item h3 {
            color: #0d6efd;
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .protocol-item h4 {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .protocol-item p {
            margin-bottom: 15px;
            white-space: pre-line;
        }
        .protocol-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .protocol-meta span {
            background-color: #e9ecef;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.9rem;
        }
        .back-button {
            margin-bottom: 20px;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px 0;
            margin-top: 50px;
            border-top: 1px solid #dee2e6;
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
        }
        #protocolList {
            min-height: 300px;
        }
        .section-title {
            margin-bottom: 20px;
            color: #495057;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .domain-box h3, .role-box h3 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="d-flex align-items-center">
                <img src="https://waymarkcare.com/wp-content/uploads/2022/10/waymark-logo-white.svg" alt="Waymark Logo">
                <h1>Population Health Protocol Library</h1>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="mainView">
            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="section-title">Browse by Domain</h2>
                </div>
            </div>
            <div class="row" id="domainBoxes">
                <!-- Domain boxes will be dynamically inserted here -->
            </div>

            <div class="row mt-5 mb-4">
                <div class="col-12">
                    <h2 class="section-title">Browse by Role</h2>
                </div>
            </div>
            <div class="row" id="roleBoxes">
                <!-- Role boxes will be dynamically inserted here -->
            </div>
        </div>

        <div id="protocolView" style="display: none;">
            <button class="btn btn-outline-primary back-button" id="backButton">
                <i class="bi bi-arrow-left"></i> Back to Main View
            </button>
            <h2 id="currentFilter" class="section-title">Protocols</h2>
            <div id="protocolList">
                <!-- Protocol items will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p>© 2025 Waymark. All protocols are evidence-based and designed for implementation in Medicaid populations.</p>
            <p>For more information, visit <a href="https://waymarkcare.com" target="_blank">waymarkcare.com</a></p>
        </div>
    </div>

    <script src="recommendations-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get unique domains and roles
            const domains = [...new Set(allRecommendations.map(item => item.domain))].sort();
            const roles = [...new Set(allRecommendations.map(item => item.role))].sort();

            // Count protocols per domain and role
            const domainCounts = {};
            const roleCounts = {};

            allRecommendations.forEach(protocol => {
                domainCounts[protocol.domain] = (domainCounts[protocol.domain] || 0) + 1;
                roleCounts[protocol.role] = (roleCounts[protocol.role] || 0) + 1;
            });

            // Populate domain boxes
            const domainBoxesContainer = document.getElementById('domainBoxes');
            domains.forEach(domain => {
                const count = domainCounts[domain] || 0;
                const domainBox = document.createElement('div');
                domainBox.className = 'col-md-4 col-sm-6 mb-4';
                domainBox.innerHTML = `
                    <div class="domain-box" data-domain="${domain}">
                        <h3>${domain}</h3>
                        <span class="count-badge">${count} protocol${count !== 1 ? 's' : ''}</span>
                    </div>
                `;
                domainBoxesContainer.appendChild(domainBox);
            });

            // Populate role boxes
            const roleBoxesContainer = document.getElementById('roleBoxes');
            roles.forEach(role => {
                const count = roleCounts[role] || 0;
                const roleBox = document.createElement('div');
                roleBox.className = 'col-md-4 col-sm-6 mb-4';
                roleBox.innerHTML = `
                    <div class="role-box" data-role="${role}">
                        <h3>${role}</h3>
                        <span class="count-badge">${count} protocol${count !== 1 ? 's' : ''}</span>
                    </div>
                `;
                roleBoxesContainer.appendChild(roleBox);
            });

            // Add event listeners to domain boxes
            document.querySelectorAll('.domain-box').forEach(box => {
                box.addEventListener('click', function() {
                    const domain = this.getAttribute('data-domain');
                    showProtocols('domain', domain);
                });
            });

            // Add event listeners to role boxes
            document.querySelectorAll('.role-box').forEach(box => {
                box.addEventListener('click', function() {
                    const role = this.getAttribute('data-role');
                    showProtocols('role', role);
                });
            });

            // Back button functionality
            document.getElementById('backButton').addEventListener('click', function() {
                document.getElementById('protocolView').style.display = 'none';
                document.getElementById('mainView').style.display = 'block';
            });

            // Function to show protocols filtered by domain or role
            function showProtocols(filterType, filterValue) {
                const protocolList = document.getElementById('protocolList');
                protocolList.innerHTML = '';

                // Update the filter title
                document.getElementById('currentFilter').textContent = 
                    filterType === 'domain' ? `${filterValue} Protocols` : `Protocols for ${filterValue}`;

                // Filter protocols
                const filteredProtocols = allRecommendations.filter(protocol => 
                    filterType === 'domain' ? protocol.domain === filterValue : protocol.role === filterValue
                );

                // Display protocols
                filteredProtocols.forEach(protocol => {
                    const protocolItem = document.createElement('div');
                    protocolItem.className = 'protocol-item';
                    
                    // Determine evidence content - use evidence field if available, fall back to citation if available
                    const evidenceContent = protocol.evidence || protocol.citation || "Evidence base not specified";
                    
                    protocolItem.innerHTML = `
                        <h3>${protocol.title}</h3>
                        <div class="protocol-meta">
                            <span><strong>Domain:</strong> ${protocol.domain}</span>
                            <span><strong>Role:</strong> ${protocol.role}</span>
                        </div>
                        <h4>Implementation Guidance</h4>
                        <p>${protocol.implementation_guidance}</p>
                        <h4>Expected Outcomes</h4>
                        <p>${protocol.expected_outcomes}</p>
                        <h4>Target Population</h4>
                        <p>${protocol.target_population}</p>
                        <h4>Evidence</h4>
                        <p>${evidenceContent}</p>
                    `;
                    protocolList.appendChild(protocolItem);
                });

                // Switch views
                document.getElementById('mainView').style.display = 'none';
                document.getElementById('protocolView').style.display = 'block';
            }
        });
    </script>
</body>
</html>
