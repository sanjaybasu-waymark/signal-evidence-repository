name: Automated Evidence Updates

on:
  schedule:
    # Run every Sunday at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to look back for new literature'
        required: false
        default: '7'
        type: string
      force_update:
        description: 'Force update even if no high-priority articles found'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  monitor-literature:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run literature monitoring
      id: monitor
      env:
        PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
        PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
      run: |
        python scripts/literature_monitor.py \
          --days-back ${{ github.event.inputs.days_back || '7' }} \
          --output-dir reports/literature \
          --format json
        
        # Check if high-priority articles were found
        if [ -f "reports/literature/latest_report.json" ]; then
          HIGH_PRIORITY=$(python -c "
          import json
          with open('reports/literature/latest_report.json') as f:
              data = json.load(f)
          print(data['summary']['high_priority_articles'])
          ")
          echo "high_priority_count=$HIGH_PRIORITY" >> $GITHUB_OUTPUT
          
          # Generate summary for PR description
          python scripts/generate_update_summary.py \
            --report reports/literature/latest_report.json \
            --output reports/literature/update_summary.md
        else
          echo "high_priority_count=0" >> $GITHUB_OUTPUT
        fi
    
    - name: Validate existing protocols
      run: |
        python scripts/data_validator.py \
          --validate-all \
          --schema protocol_schema.json \
          --data-dir data/protocols \
          --output reports/validation/validation_report.json
    
    - name: Generate protocol update recommendations
      if: steps.monitor.outputs.high_priority_count > 0 || github.event.inputs.force_update == 'true'
      run: |
        python scripts/protocol_updater.py \
          --literature-report reports/literature/latest_report.json \
          --protocols-dir data/protocols \
          --output reports/updates/protocol_recommendations.json
    
    - name: Create update branch
      if: steps.monitor.outputs.high_priority_count > 0 || github.event.inputs.force_update == 'true'
      run: |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        BRANCH_NAME="evidence-update-$TIMESTAMP"
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
        
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout -b $BRANCH_NAME
    
    - name: Commit literature monitoring results
      if: steps.monitor.outputs.high_priority_count > 0 || github.event.inputs.force_update == 'true'
      run: |
        git add reports/
        git commit -m "📚 Literature monitoring results - $(date +%Y-%m-%d)
        
        - Found ${{ steps.monitor.outputs.high_priority_count }} high-priority articles
        - Generated protocol update recommendations
        - Validation report included
        
        Automated by GitHub Actions"
    
    - name: Push update branch
      if: steps.monitor.outputs.high_priority_count > 0 || github.event.inputs.force_update == 'true'
      run: |
        git push origin $BRANCH_NAME
    
    - name: Create Pull Request
      if: steps.monitor.outputs.high_priority_count > 0 || github.event.inputs.force_update == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.BRANCH_NAME }}
        title: "🔄 Evidence Update - ${{ steps.monitor.outputs.high_priority_count }} High-Priority Articles"
        body-path: reports/literature/update_summary.md
        labels: |
          evidence-update
          automated
          review-required
        assignees: |
          sanjaybasu-waymark
        reviewers: |
          sanjaybasu-waymark
    
    - name: Create issue for manual review
      if: steps.monitor.outputs.high_priority_count > 5
      uses: peter-evans/create-issue-action@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        title: "🚨 High Volume of Evidence Updates Detected"
        body: |
          ## Evidence Update Alert
          
          The automated literature monitoring system has detected **${{ steps.monitor.outputs.high_priority_count }}** high-priority articles that may require protocol updates.
          
          This is above the normal threshold and may indicate:
          - New clinical guidelines have been published
          - Significant research findings in multiple domains
          - Changes in evidence base requiring immediate attention
          
          ### Recommended Actions:
          1. Review the pull request created by this workflow
          2. Prioritize high-impact protocol updates
          3. Consider convening editorial review board if needed
          4. Update monitoring thresholds if this becomes routine
          
          ### Reports Generated:
          - Literature monitoring report: `reports/literature/latest_report.json`
          - Protocol update recommendations: `reports/updates/protocol_recommendations.json`
          - Validation report: `reports/validation/validation_report.json`
          
          **Pull Request:** Will be linked automatically when created.
        labels: |
          high-priority
          evidence-update
          manual-review-required
    
    - name: Update monitoring dashboard
      if: always()
      run: |
        python scripts/update_dashboard.py \
          --monitoring-report reports/literature/latest_report.json \
          --validation-report reports/validation/validation_report.json \
          --output docs/dashboard/monitoring_status.json
    
    - name: Notify on failure
      if: failure()
      uses: peter-evans/create-issue-action@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        title: "❌ Literature Monitoring Workflow Failed"
        body: |
          ## Workflow Failure Alert
          
          The automated literature monitoring workflow failed during execution.
          
          **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Triggered by:** ${{ github.event_name }}
          **Branch:** ${{ github.ref }}
          
          ### Possible Causes:
          - PubMed API rate limiting or service issues
          - Network connectivity problems
          - Changes in external RSS feeds or APIs
          - Schema validation errors in existing protocols
          - Missing or invalid environment variables
          
          ### Immediate Actions Required:
          1. Check workflow logs for specific error messages
          2. Verify PubMed API credentials and rate limits
          3. Test external data source connectivity
          4. Run validation checks on existing protocol data
          
          This issue will be automatically closed when the workflow succeeds again.
        labels: |
          bug
          workflow-failure
          urgent

  validate-protocols:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate protocol schema
      run: |
        python scripts/data_validator.py \
          --validate-schema protocol_schema.json
    
    - name: Validate all protocols
      run: |
        python scripts/data_validator.py \
          --validate-all \
          --schema protocol_schema.json \
          --data-dir data/protocols \
          --output validation_report.json \
          --fail-on-error
    
    - name: Check for broken links
      run: |
        python scripts/link_checker.py \
          --protocols-dir data/protocols \
          --output link_check_report.json
    
    - name: Generate validation summary
      if: always()
      run: |
        python scripts/generate_validation_summary.py \
          --validation-report validation_report.json \
          --link-report link_check_report.json \
          --output validation_summary.md
    
    - name: Comment validation results
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ github.event.pull_request.number }}
        body-path: validation_summary.md

  deploy-updates:
    runs-on: ubuntu-latest
    needs: [monitor-literature, validate-protocols]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build enhanced data files
      run: |
        python scripts/build_enhanced_data.py \
          --protocols-dir data/protocols \
          --output docs/data/protocols.json \
          --include-search-index
    
    - name: Update search index
      run: |
        python scripts/build_search_index.py \
          --protocols docs/data/protocols.json \
          --output docs/data/search_index.json
    
    - name: Generate API documentation
      run: |
        python scripts/generate_api_docs.py \
          --schema protocol_schema.json \
          --output docs/api/
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        cname: protocols.waymarkcare.com

